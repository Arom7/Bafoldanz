; Desarrollo — docs/05-despliegue.md
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
memory_limit = 256M

; Xdebug se activa con build-arg XDEBUG=true (no por ini, para no cargar la extensión si no está)
; Si está activa, variables sugeridas (descomentar si se usa):
; xdebug.mode = develop,debug
; xdebug.client_host = host.docker.internal
; xdebug.start_with_request = yes
